import com.modrinth.minotaur.dependencies.ModDependency

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}"
    id "com.modrinth.minotaur" version "2.+"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

java {
    withSourcesJar()
}

def copyCommonClasses = tasks.register("copyCommonClasses", Copy) {
    dependsOn(":common:classes")
    from(project(":common").sourceSets.main.output.classesDirs)
    into(layout.buildDirectory.dir("classes/java/main").get().asFile)
}

tasks.named("classes").configure {
    dependsOn(copyCommonClasses)
}

sourceSets {
    main {
        resources.srcDir(project(":common").file("src/main/resources"))
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':common')
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_api_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description,
            cloth_config_api_version: project.cloth_config_api_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named("jar").configure {
    dependsOn(copyCommonClasses)
    archiveFileName.set("simple-coordinates-${project.version}-neoforge-mc${project.minecraft_version}.jar")
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named("sourcesJar").configure {
    archiveFileName.set("simple-coordinates-${project.version}-neoforge-sources.jar")
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir("repo").asFile.absolutePath
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.mod_version}-mc${project.minecraft_version}"
    versionName = "v${project.mod_version}-mc${project.minecraft_version}-neoforge"
    uploadFile = jar
    gameVersions = [project.minecraft_version]
    loaders = ['neoforge']
    dependencies = [
            new ModDependency('9s6osm5g', 'required')
    ]
}
